name: Sync Daily News from OneDrive

on:
  schedule:
    # 22:30 UTC = 06:30 AM Hong Kong Time (UTC+8)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download HTML from OneDrive File Link
        env:
          SHARED_URL: ${{ secrets.ONEDRIVE_FILE_URL }}
        run: |
          python - << 'EOF'
          import base64
          import json
          import os
          import urllib.request

          raw_url = os.environ.get("SHARED_URL", "").strip()
          if not raw_url:
              raise ValueError("Error: ONEDRIVE_FILE_URL secret is empty.")

          print(f"Resolving direct download link for: {raw_url}")

          # Encode OneDrive share URL to Microsoft share token format (u!...)
          encoded = base64.b64encode(raw_url.encode("utf-8")).decode("utf-8")
          share_token = "u!" + encoded.rstrip("=").replace("/", "_").replace("+", "-")

          # Query the OneDrive public share API metadata endpoint
          api_url = f"https://api.onedrive.com/v1.0/shares/{share_token}/root"
          req = urllib.request.Request(api_url, headers={"User-Agent": "Mozilla/5.0"})

          try:
              with urllib.request.urlopen(req) as resp:
                  metadata = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
              print(f"API query failed ({e}), attempting fallback direct content endpoint...")
              direct_download_url = f"https://api.onedrive.com/v1.0/shares/{share_token}/root/content"
          else:
              direct_download_url = metadata.get("@content.downloadUrl")
              if not direct_download_url:
                  direct_download_url = f"https://api.onedrive.com/v1.0/shares/{share_token}/root/content"

          print("Fetching HTML content...")
          dl_req = urllib.request.Request(direct_download_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(dl_req) as response:
              content = response.read().decode("utf-8", errors="ignore")

          # Verify the payload contains actual HTML
          if "<!doctype html" not in content.lower() and "<html" not in content.lower():
              print("Response snippet:", content[:300])
              raise ValueError("Downloaded content is not valid HTML. Ensure the link has public permissions.")

          # Save to repository
          with open("Daily_News(EL).html", "w", encoding="utf-8") as f:
              f.write(content)

          print("Successfully downloaded and saved Daily_News(EL).html")
          EOF

      - name: Update index.html and archive
        run: |
          cp "Daily_News(EL).html" index.html
          mkdir -p archive
          DATE_STAMP=$(TZ="Asia/Hong_Kong" date +'%Y%m%d')
          cp "Daily_News(EL).html" "archive/${DATE_STAMP}.html"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Daily_News(EL).html" index.html archive/
          git commit -m "Auto-sync Daily_News(EL) $(TZ='Asia/Hong_Kong' date +'%Y%m%d')" || exit 0
          git push
