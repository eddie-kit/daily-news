name: Sync Daily News from OneDrive

on:
  schedule:
    # 22:30 UTC = 06:30 AM Hong Kong Time (UTC+8)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HTML from OneDrive Direct Link
        env:
          DOWNLOAD_URL: ${{ secrets.ONEDRIVE_FILE_URL }}
        run: |
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: ONEDRIVE_FILE_URL secret is empty."
            exit 1
          fi

          echo "Downloading Daily_News(EL).html from OneDrive..."
          curl -fSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$DOWNLOAD_URL" -o "Daily_News(EL).html"

          # Verify that the downloaded content is valid HTML
          if ! grep -qiE "<!doctype html|<html" "Daily_News(EL).html"; then
            echo "Error: Downloaded file does not contain valid HTML."
            head -n 20 "Daily_News(EL).html"
            exit 1
          fi

          echo "Successfully downloaded Daily_News(EL).html."

      - name: Update index.html and archive
        run: |
          cp "Daily_News(EL).html" index.html
          mkdir -p archive
          DATE_STAMP=$(TZ="Asia/Hong_Kong" date +'%Y%m%d')
          cp "Daily_News(EL).html" "archive/${DATE_STAMP}.html"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Daily_News(EL).html" index.html archive/
          git commit -m "Auto-sync Daily_News(EL) $(TZ='Asia/Hong_Kong' date +'%Y%m%d')" || exit 0
          git push
