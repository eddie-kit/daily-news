name: Sync Daily News from OneDrive

on:
  schedule:
    # 22:30 UTC = 06:30 AM HKT (Hong Kong Time / UTC+8)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download HTML from OneDrive Link
        env:
          SHARED_URL: ${{ secrets.ONEDRIVE_FILE_URL }}
        run: |
          python - << 'EOF'
          import os
          import base64
          import urllib.request

          raw_url = os.environ.get("SHARED_URL", "").strip()
          if not raw_url:
              raise ValueError("Missing ONEDRIVE_FILE_URL secret.")

          # Handle direct download parameters if already an embed/download URL
          if "download=1" in raw_url:
              direct_url = raw_url
          elif raw_url.startswith("https://1drv.ms/"):
              # Convert Personal OneDrive 1drv.ms sharing link to Graph/OneDrive content API URL
              encoded = base64.b64encode(raw_url.encode("utf-8")).decode("utf-8")
              encoded_token = "u!" + encoded.rstrip("=").replace("/", "_").replace("+", "-")
              direct_url = f"https://api.onedrive.com/v1.0/shares/{encoded_token}/root/content"
          elif "onedrive.live.com" in raw_url and "resid=" in raw_url:
              direct_url = raw_url.replace("redir?", "download?").replace("view.aspx?", "download?")
          else:
              direct_url = raw_url + ("&download=1" if "?" in raw_url else "?download=1")

          print(f"Fetching from download endpoint...")
          req = urllib.request.Request(direct_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req) as response:
              content = response.read().decode("utf-8", errors="ignore")

          # Verify response contains valid HTML structure
          if "<!doctype html" not in content.lower() and "<html" not in content.lower():
              print("Output preview:", content[:300])
              raise ValueError("Downloaded file is not valid HTML. Ensure the OneDrive link is public ('Anyone with the link can view').")

          with open("Daily_News(EL).html", "w", encoding="utf-8") as f:
              f.write(content)
          print("Daily_News(EL).html successfully retrieved.")
          EOF

      - name: Update index.html and archive
        run: |
          cp "Daily_News(EL).html" index.html
          mkdir -p archive
          DATE_STAMP=$(TZ="Asia/Hong_Kong" date +'%Y%m%d')
          cp "Daily_News(EL).html" "archive/${DATE_STAMP}.html"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Daily_News(EL).html" index.html archive/
          git commit -m "Auto-sync Daily_News(EL) $(TZ='Asia/Hong_Kong' date +'%Y%m%d')" || exit 0
          git push
